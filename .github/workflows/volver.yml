# Galera: vuelta atrás. Se lanza a mano (Actions → Volver) con `codigo`: un tag de una versión que ya estuvo
# publicada (por ejemplo v170). Pide la misma aprobación que Publicar (entorno `produccion`), publica ese código con
# desplegar.yml y mueve el tag `produccion` a ese commit. Mover el tag importa: datos.yml publica sobre `produccion`,
# y si el tag quedara en el código malo, la próxima corrida de datos lo volvería a publicar.
# Procedimiento completo: README, «Volver atrás».
name: Volver

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: Tag de la última versión buena (por ejemplo v170)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolver.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Solo tags de versión, y que existan: un typo no debería llegar a pedir aprobación.
      - id: resolver
        env:
          CODIGO: ${{ inputs.codigo }}
        run: |
          if ! printf '%s' "$CODIGO" | grep -Eq '^v[0-9]+$'; then
            echo "::error::«$CODIGO» no es un tag de versión (v170, v175…)."
            exit 1
          fi
          commit=$(git rev-parse --verify --quiet "refs/tags/$CODIGO^{commit}") || {
            echo "::error::El tag $CODIGO no existe."
            exit 1
          }
          echo "Se vuelve a $CODIGO ($commit)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  aprobar:
    needs: validar
    runs-on: ubuntu-latest
    concurrency:
      group: volver
      cancel-in-progress: false
    environment:
      name: produccion
    steps:
      - run: echo "Aprobado volver a ${{ needs.validar.outputs.commit }}"

  publicar:
    needs: [validar, aprobar]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/desplegar.yml
    with:
      codigo: ${{ needs.validar.outputs.commit }}

  marcar:
    needs: [validar, publicar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validar.outputs.commit }}
      - env:
          COMMIT: ${{ needs.validar.outputs.commit }}
        run: |
          git tag -f produccion "$COMMIT"
          git push -f origin refs/tags/produccion
