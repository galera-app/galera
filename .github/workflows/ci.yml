# Galera: controles automáticos en cada PR. Si falla alguno, no se mergea (regla «main» del repo).
# Requiere en el repo: tools/verificar_seo.py (copia de 404-personal-infra/calidad/verificar_seo.py).
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verificar_seo --solo-cambios compara contra origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Los JSON de datos son válidos
        run: |
          python - <<'PY'
          import json, pathlib, sys
          malos = []
          for p in pathlib.Path(".").rglob("*.json"):
              if ".git" in p.parts: continue
              try: json.loads(p.read_text(encoding="utf-8"))
              except Exception as e: malos.append(f"{p}: {e}")
          print("\n".join(malos) or "JSON ok")
          sys.exit(1 if malos else 0)
          PY
      - name: La sintaxis de los JS es válida
        run: git ls-files '*.js' | xargs -n1 node --check
      - name: Antes de imprimir analiza e impone bien (PDF de prueba)
        run: node tools/probar_imprenta.js
      - name: Pruebas de la calculadora de lomo
        run: node tools/probar_lomo.js
      - name: Pruebas del redactor de contratos
        run: node tools/probar_contratos.js
      - name: Instalar Pagefind (el buscador)
        run: pip install "pagefind[extended]==1.6.0" rjsmin==1.3.0 rcssmin==1.3.0
      - name: Las páginas llevan marcas y el armado de marco/ funciona
        run: python tools/armar.py --comprobar
      - name: Sin manejadores en línea (la CSP no permite scripts en línea)
        run: python tools/controlar_acciones.py
      - name: Cada apunte publicado tiene sus descargas
        run: python tools/controlar_descargas.py
      - name: Armar el sitio publicable (dist/)
        env:
          GALERA_EXIGIR_BUSCADOR: "1"
        run: python tools/armar.py --salida dist
      - name: Pruebas de mantenimiento (datos, sitemap, CSP, service worker; ~25 s)
        run: python tools/probar.py dist
      - name: Humo de los simuladores (sin DOM)
        run: node tools/probar_simuladores.js
      - name: Capitulares góticas ambiguas (S, G, I, J) sin sin-cap
        run: python tools/controlar_capitulares.py dist
      - name: Las pantallas clave responden
        run: |
          python -m http.server 8000 --directory dist >/dev/null 2>&1 &
          sleep 2
          python tools/humo.py http://localhost:8000
          curl -fsS http://localhost:8000/buscar/ >/dev/null
          test -f dist/pagefind/pagefind.js
      - name: SEO y vista previa (cero fallas)
        run: python tools/verificar_seo.py dist --dominio https://galera.com.ar
